<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Global Scripts</title>

  <!-- Three.js and MathBox CDN (loaded as globals) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathbox@latest/build/bundle/mathbox.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathbox@latest/build/mathbox.css">

  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #00ff00;
    }
    .success { color: #00ff00; }
    .error { color: #ff0000; }
    #viz-container {
      width: 600px;
      height: 400px;
      border: 2px solid #00ff00;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Global Scripts Test</h1>
  <div id="results"></div>
  <div id="viz-container"></div>

  <script type="module">
    const results = document.getElementById('results');

    function log(message, type = 'success') {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = message;
      results.appendChild(div);
      console.log(message);
    }

    // Test 1: Check if THREE exists
    if (window.THREE) {
      log('✓ window.THREE is loaded', 'success');
      log(`  THREE.REVISION: ${window.THREE.REVISION}`, 'success');
    } else {
      log('✗ window.THREE is NOT loaded', 'error');
    }

    // Test 2: Check if OrbitControls exists
    if (window.THREE && window.THREE.OrbitControls) {
      log('✓ window.THREE.OrbitControls is loaded', 'success');
    } else {
      log('✗ window.THREE.OrbitControls is NOT loaded', 'error');
    }

    // Test 3: Check if MathBox exists
    if (window.MathBox) {
      log('✓ window.MathBox is loaded', 'success');
    } else {
      log('✗ window.MathBox is NOT loaded', 'error');
    }

    // Test 4: Try to create a ToolsManager
    if (window.THREE && window.MathBox && window.THREE.OrbitControls) {
      try {
        log('\nAttempting to load ToolsManager from ES6 module...', 'success');

        import('/src/core/tools-manager.js')
          .then(module => {
            log('✓ ToolsManager module loaded', 'success');

            const container = document.getElementById('viz-container');
            const manager = new module.ToolsManager(container);
            log('✓ ToolsManager instance created successfully!', 'success');
            log('  MathBox initialized', 'success');
          })
          .catch(err => {
            log('✗ Failed to create ToolsManager', 'error');
            log(`  Error: ${err.message}`, 'error');
            console.error(err);
          });
      } catch (err) {
        log('✗ Failed to test ToolsManager', 'error');
        log(`  Error: ${err.message}`, 'error');
      }
    } else {
      log('\n✗ Cannot test ToolsManager - required globals missing', 'error');
    }
  </script>
</body>
</html>
